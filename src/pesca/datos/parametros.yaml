# Parametros del modelo (especificacion §5, §6 y §10).
# Cada parametro hoja tiene:
#   valor     numero, texto, lista o {min, max} si es una distribucion uniforme
#   rango     [min, max] para Monte Carlo (opcional)
#   etiqueta  MEDIDO | DATO | OFICIAL | CALIBRADO | SIMULADO | CONFIRMAR
#   nota      explicacion corta (opcional)
# Unidades: km, h, kg, COP, °C.

