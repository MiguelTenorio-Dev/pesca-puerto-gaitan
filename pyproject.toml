[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pesca-puerto-gaitan"
version = "1.0.0"
description = "Transporte y cadena de frio del pescado en Puerto Gaitan (Meta): diagnostico, optimizacion y app web"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "MiguelTenorio-Dev" }]
dependencies = [
    "networkx>=3.2",
    "pandas>=2.1",
    "numpy>=1.26",
    "matplotlib>=3.8",
    "folium>=0.15",
    "streamlit>=1.46",
    "streamlit-folium>=0.20",
    "pulp>=2.8,<3",  # PuLP 3+ ya no trae CBC integrado
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "markdown>=3.5"]  # markdown: solo para el PDF del informe

[project.scripts]
pesca-gaitan = "pesca.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
pesca = [
    "datos/*.yaml",
    "datos/*.csv",
    "datos/precalculado/*",
    "datos/rutas_kml/*",
    "datos/grafo/*.csv",
    "app/*.py",
    "app/pages/*.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
